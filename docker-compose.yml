version: '3.8'

services:

  # ── MongoDB ───────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: datashield-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (Node.js API) ─────────────────────────
  backend:
    build: ./webapp/backend
    container_name: datashield-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/cyberhack
      - JWT_SECRET=cyberhack_prod_jwt_secret_key_987654!
      - PORT=5000
      - GOOGLE_CLIENT_ID=175774828165-8rdv11q0aonla7c5gjserhht8dse58ah.apps.googleusercontent.com
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Frontend (React + Nginx) ──────────────────────
  frontend:
    build: ./webapp/frontend
    container_name: datashield-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
